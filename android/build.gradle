android {
    /*******************************************************
     * The following variables:
     * - androidBuildToolsVersion,
     * - androidCompileSdkVersion
     * - qtAndroidDir - holds the path to qt android files
     *                   needed to build any Qt application
     *                   on Android.
     *
     * are defined in gradle.properties file. This file is
     * updated by QtCreator and androiddeployqt tools.
     * Changing them manually might break the compilation!
     *******************************************************/

    namespace androidPackageName
    compileSdkVersion androidCompileSdkVersion
    buildToolsVersion androidBuildToolsVersion
    ndkVersion androidNdkVersion

    // Extract native libraries from the APK
    packagingOptions.jniLibs.useLegacyPackaging true


    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = [qtAndroidDir + '/src', 'src', 'java']
            aidl.srcDirs = [qtAndroidDir + '/src', 'src', 'aidl']
            res.srcDirs = [qtAndroidDir + '/res', 'res']
            resources.srcDirs = ['resources']
            renderscript.srcDirs = ['src']
            assets.srcDirs = ['assets']
            jniLibs.srcDirs = ['libs']

       }
    }

    tasks.withType(JavaCompile) {
        options.incremental = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        abortOnError false
    }

    // Do not compress Qt binary resources file
    aaptOptions {
        noCompress 'rcc'
    }

    defaultConfig {

        resConfig "en"
        minSdkVersion qtMinSdkVersion
        targetSdkVersion qtTargetSdkVersion
        ndk.abiFilters = qtTargetAbiList.split(",")
    }
}


// --- IMPORTANT : AJOUTE CE BLOC EN DEHORS DE 'dependencies {}', IDÉALEMENT APRÈS LE BLOC 'android {}' ---
configurations.all {
    resolutionStrategy {
        // Force l'utilisation de versions spécifiques pour les bibliothèques critiques.
        // Cela empêche Gradle de tirer une version plus ancienne ou incompatible
        // si une autre dépendance la requiert.
        force 'androidx.core:core:1.13.1'
        force 'androidx.appcompat:appcompat:1.6.1'
        force 'androidx.annotation:annotation:1.6.0'
        force 'androidx.media:media:1.7.0' // Force explicitement cette version

        // Logique pour exclure proactivement les anciennes bibliothèques de support si elles apparaissent.
        // Cela peut aider à prévenir les conflits de classes internes.
        eachDependency { DependencyResolveDetails details ->
            def requested = details.getRequested()
            if (requested.group == 'com.android.support') {
                // C'est une stratégie agressive pour bloquer toutes les dépendances 'com.android.support'.
                // Utilise-la avec prudence, mais elle est souvent nécessaire pour ce type de bug.
                details.useTarget("com.android.support:support-compat:28.0.0") // Une version obsolète, pour la remplacer
                details.because "Force exclusion of old support libraries."
                details.useVersion "28.0.0" // Une version obsolète, pour forcer la non-utilisation
                details.force() // Assure que la force est appliquée
            }
        }
    }
}
